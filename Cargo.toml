[package]
name = "hmc"
version = "0.1.0"
edition = "2024"

[lib]
name = "hmc"
path = "src/lib.rs"

[[bin]]
name = "hmc"
path = "src/main.rs"

[[bin]]
name = "hmc_gui"
path = "src/bin/hmc_gui.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
kuva = { version = "0.2.0", features = ["pdf"] }
rand = "0.10.1"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
eframe = { version = "0.34.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.35.0"
